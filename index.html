<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF Connector</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const target = urlParams.get('url');
        
        if (target) {
            // 핵심: 현재 페이지를 이동시키는 대신, iframe을 생성하여 신호만 보냄
            // 이렇게 하면 '현재 탭'은 아무런 페이지 이동이 발생하지 않습니다.
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = target;
            document.body.appendChild(iframe);

            // 신호를 보낸 후 0.5초 뒤에 현재 창을 닫음
            // (구글 독스에서 새 탭으로 열렸을 경우 그 새 탭만 자폭)
            setTimeout(() => {
                window.open('', '_self', '');
                window.close();
            }, 500);
        }
    </script>
    <div style="text-align: center; padding-top: 20px;">
        <h3>PDF 프로그램을 호출 중입니다...</h3>
        <p>연결 후 이 창은 자동으로 닫힙니다.</p>
    </div>
</body>
</html>
