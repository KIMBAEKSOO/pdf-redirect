<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF Link</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const target = urlParams.get('url');
        
        if (target) {
            // 핵심: 페이지 자체를 이동하지 않고 프로토콜만 호출
            // 브라우저는 URL이 바뀌지 않았다고 판단하여 독스 탭을 유지합니다.
            location.replace(target);

            // 0.5초 뒤에 이전 페이지(구글 독스)로 강제 복귀
            // 만약 새 탭으로 열렸다면 이 명령은 무시되거나 빈 창으로 남습니다.
            setTimeout(() => {
                if (history.length > 1) {
                    history.back();
                } else {
                    // 새 탭인 경우 그냥 '연결 완료' 메시지만 띄우고 멈춤 (닫지 않음)
                    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>PDF 연결 완료. 이 창을 닫으셔도 됩니다.</h2>";
                }
            }, 100);
        }
    </script>
</body>
</html>
