<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF Link</title>
</head>
<body style="background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const target = urlParams.get('url');
        
        if (target) {
            // 1. 즉시 프로토콜 호출 (지연 없음)
            location.href = target;

            // 2. 아주 짧은 찰나(0.1초)만 대기 후 상태 변경
            setTimeout(() => {
                if (window.history.length > 1) {
                    // 구글 독스 탭에서 그대로 열렸다면 즉시 뒤로가기
                    window.history.back();
                } else {
                    // 새 탭으로 열렸다면 즉시 완료 메시지 표시
                    document.body.innerHTML = "<div style='text-align:center; font-family:sans-serif;'><h2>✅ 연결 완료</h2><p>이 창은 닫으셔도 됩니다.</p></div>";
                }
            }, 100); 
        }
    </script>
</body>
</html>
